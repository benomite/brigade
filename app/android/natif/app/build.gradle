apply plugin: 'com.android.application'

android {
    // L'identifiant de l'app Android : le même que celui de l'app du Mac (app/packaging/construire.ts),
    // et que `appId` de ../../capacitor.config.json.
    namespace = "com.github.benomite.brigade"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.github.benomite.brigade"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Elle croît à chaque release (jamais deux fois la même) : sans quoi Android refuse de mettre
        // l'app à jour sur place. app/packaging/android-stable.ts le vérifie.
        versionCode 2
        // La version construite, que donne app/packaging/android.ts (-PbrigadeVersion=…).
        versionName project.findProperty('brigadeVersion') ?: '0.0.0'
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // La clé de release est la même à chaque release, et elle n'est jamais dans le dépôt : elle vient
    // de l'environnement (ou des secrets de la CI). Même identifiant et même clé, c'est ce qui laisse
    // Android installer la nouvelle version par-dessus l'ancienne, appairage et projets conservés.
    signingConfigs {
        release {
            def keystore = System.getenv('BRIGADE_KEYSTORE_FILE')
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('BRIGADE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('BRIGADE_KEY_ALIAS')
                keyPassword System.getenv('BRIGADE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Le pont d'attente s'injecte au début de chaque document (Pont.java).
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

// Écrit par `cap sync` (app/packaging/android.ts) : il n'est pas dans le dépôt.
apply from: 'capacitor.build.gradle'

// Une release sans clé ne se construit pas : elle sortirait non signée, ou signée d'une autre clé,
// et ne s'installerait pas par-dessus l'ancienne.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.endsWith('Release') && it.project == project } && !System.getenv('BRIGADE_KEYSTORE_FILE')) {
        throw new GradleException('A release is signed with the release key: set BRIGADE_KEYSTORE_FILE, BRIGADE_KEYSTORE_PASSWORD, BRIGADE_KEY_ALIAS and BRIGADE_KEY_PASSWORD')
    }
}
