// Le projet Gradle de l'enveloppe Android (le gabarit de Capacitor 8.5.3). Les versions y sont
// épinglées : Android Gradle Plugin ici, Gradle dans gradle/wrapper/, les SDK et AndroidX dans
// variables.gradle, Capacitor dans ../package.json et son verrou.

// Maven Central répond 403 aux runners de GitHub quand il limite leur adresse (#2025) : le miroir de
// Google passe en premier — un artefact qu'il n'a pas (404) se cherche ensuite sur Maven Central.
buildscript {
    repositories {
        google()
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
