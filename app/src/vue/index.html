<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Sur un téléphone (l'APK Android, ticket 1151), la page prend la largeur de l'écran : la page étroite s'y pose (ticket 1186). -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Rien ne vient du réseau : les scripts, les styles et les polices sont ceux de l'app. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src data:" />
    <title>brigade</title>
    <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
    <!-- Les jetons d'abord — les couleurs et les polices, embarquées —, puis la peau qui les nomme. -->
    <link rel="stylesheet" href="jetons.css" />
    <!-- Le bouton, une seule famille (ticket 2916) : avant la peau, qu'une règle d'écran (`.mono`) le précise sans le redessiner. -->
    <link rel="stylesheet" href="composants/bouton/bouton.css" />
    <!-- La pastille, un seul état de ticket pour tous les écrans (ticket 2917) : avant la peau. -->
    <link rel="stylesheet" href="composants/pastille/pastille.css" />
    <!-- Le bon et la carte d'attente (ticket 2918), l'un sur l'autre : avant la peau, qui ne les redessine pas. -->
    <link rel="stylesheet" href="composants/bon/bon.css" />
    <link rel="stylesheet" href="composants/carte-attente/carte-attente.css" />
    <!-- La poêle qui grésille à côté de ce qu'un agent fait en ce moment (ticket 2984). -->
    <link rel="stylesheet" href="composants/poele/poele.css" />
    <!-- La confirmation, la ligne vide et la ligne d'erreur (ticket 2919) : une de chaque, pour tous les écrans. -->
    <link rel="stylesheet" href="composants/confirmation/confirmation.css" />
    <link rel="stylesheet" href="composants/ligne-vide/ligne-vide.css" />
    <link rel="stylesheet" href="composants/ligne-erreur/ligne-erreur.css" />
    <!-- L'interrupteur (ticket 2914) : un seul pour tout marche / arrêt de chaque écran. -->
    <link rel="stylesheet" href="composants/interrupteur/interrupteur.css" />
    <!-- La rangée de réglage (ticket 2920) : une seule pour chaque réglage de chaque écran, avant la peau. -->
    <link rel="stylesheet" href="composants/reglage/reglage.css" />
    <link rel="stylesheet" href="cartes-du-chef/cartes-du-chef.css" />
    <link rel="stylesheet" href="todo-carte/geste.css" />
    <link rel="stylesheet" href="validation-design/validation-design.css" />
    <link rel="stylesheet" href="carte-sensible/carte-sensible.css" />
    <link rel="stylesheet" href="undo/undo.css" />
    <link rel="stylesheet" href="rail-bloque/rail-bloque.css" />
    <link rel="stylesheet" href="attente-du-rail/attente-du-rail.css" />
    <link rel="stylesheet" href="backlog-band/backlog-band.css" />
    <link rel="stylesheet" href="carte-attente/carte-attente.css" />
    <link rel="stylesheet" href="vue.css" />
    <link rel="stylesheet" href="settings-humans/humains.css" />
    <link rel="stylesheet" href="recurrents/recurrents.css" />
    <link rel="stylesheet" href="explications/explications.css" />
    <link rel="stylesheet" href="identites-github.css" />
    <link rel="stylesheet" href="projets-servis/projets-servis.css" />
    <link rel="stylesheet" href="autonomie/chiffres.css" />
    <link rel="stylesheet" href="resume-hebdomadaire/resume-hebdomadaire.css" />
    <link rel="stylesheet" href="reglages-stations/stations.css" />
    <link rel="stylesheet" href="visite/visite.css" />
    <link rel="stylesheet" href="absence/absence.css" />
    <link rel="stylesheet" href="essai/projet-d-essai.css" />
    <link rel="stylesheet" href="parcours-premier-projet/parcours-premier-projet.css" />
    <link rel="stylesheet" href="premier-ticket/premier-ticket.css" />
    <link rel="stylesheet" href="recit-premier-ticket/recit-premier-ticket.css" />
    <link rel="stylesheet" href="installation-projet/installation-projet.css" />
    <link rel="stylesheet" href="choix-station/choix-station.css" />
    <link rel="stylesheet" href="stations-tab/stations-tab.css" />
    <!-- Pas de bundler : la vue importe xterm par son nom, le navigateur le trouve ici. -->
    <script type="importmap">
      {
        "imports": {
          "@xterm/xterm": "../../node_modules/@xterm/xterm/lib/xterm.mjs",
          "@xterm/addon-fit": "../../node_modules/@xterm/addon-fit/lib/addon-fit.mjs"
        }
      }
    </script>
    <script type="module" src="vue.js"></script>
  </head>
  <body>
    <!-- L'invite de mise à jour de l'app Android (ticket 1170) : vide, et cachée, tant qu'aucune version plus haute n'est offerte. -->
    <!-- Le bandeau d'une version plus haute (ticket 1528) : vide, et caché, tant qu'aucune n'est publiée pour ce poste,
         ou quand le chef a écarté celle-ci. -->
    <section id="nouvelle-version" aria-label="New version" aria-live="polite" hidden></section>
    <!-- La connexion du téléphone à GitHub (l'app Android, ticket 2500) : sur une installation neuve, le premier écran —
         l'app derrière reste cachée. Connecté, il ne garde qu'une ligne, en tête des projets, qui dit sous quel compte. -->
    <section id="connexion-github" aria-label="Sign in to GitHub" hidden></section>
    <div id="cadre">
    <nav id="projets" aria-label="Projects"></nav>
    <section id="tous" aria-label="All projects" hidden></section>
    <!-- Les cartes qui attendent le chef, à la largeur d'un téléphone (ticket 2915) : elles prennent la place de « All projects ». -->
    <section id="cartes-du-chef" aria-label="Cards awaiting you" hidden></section>
    <!-- Le détail en grand d'une carte « Validate its screen » (ticket 3212) : un clic sur la carte l'ouvre par-dessus l'app,
         en plein écran sur le téléphone ; fermé — son bouton, Échap, ou l'un de ses deux gestes —, il rend ce qui était dessous. -->
    <section id="detail-de-validation" role="dialog" aria-modal="true" aria-label="A design validation, in large" tabindex="-1" hidden></section>
    <!-- L'écran « Add a project » (ticket 3181, parcours-projet/ajout.js) : le choix du dépôt, et rien d'autre. -->
    <section id="ajout" aria-label="Add a project" hidden></section>
    <main>
      <!-- La bande d'alertes : est-ce que ça peut tourner ? Vide quand tout va bien — elle ne prend alors aucune place. -->
      <section id="alertes" aria-label="What stops it running" aria-live="polite" hidden></section>
      <section id="arret" aria-live="polite" hidden></section>
      <header>
        <strong id="espace" class="mono"></strong>
        <!-- Le menu du projet (ticket 2485, 2921) : Rail · Stations · Settings. Un seul onglet est montré au centre ; le
             second, à droite, ne change pas de l'un à l'autre. Settings s'ouvre par-dessus. -->
        <div id="onglets-du-projet" role="tablist" aria-label="Project menu" hidden></div>
        <!-- L'interrupteur de l'espace, un seul pour tout le projet (ticket 1406) — allumé ou éteint, toujours en vue ; un clic le bascule. -->
        <div id="interrupteur-projet" class="interrupteur-de-tete" hidden></div>
      </header>
      <!-- Tant que le projet qu'« Add a project » vient d'ouvrir n'est pas prêt (ticket 3166) : à la place du rail, une question
           à la fois — qui le cuit, puis sa mise en place s'il le faut —, ce qui est attendu et de qui. Prêt, une ligne au-dessus
           du rail propose d'écrire son premier ticket avec le second. -->
      <section id="parcours-premier-projet" aria-label="Until the project is ready" aria-live="polite" hidden></section>
      <!-- Le premier ticket du premier projet du chef (ticket 3302) : une ligne à chaque vraie étape, à mesure qu'elle se passe —
           pris, PR ouverte, en pass, renvoyé et pourquoi, servi avec le lien de sa PR. Rangé d'un geste, il ne revient plus. -->
      <!-- Un projet dont la mise en place vient de passer, qu'aucune station ne sert (ticket 3400) : au-dessus du rail, la
           question — quelle station le sert —, cet ordinateur en tête. -->
      <section id="installation-projet" aria-label="Which station serves this project" aria-live="polite" hidden></section>
      <section id="recit-premier-ticket" aria-label="Your first ticket, step by step" aria-live="polite" hidden></section>
      <!-- Les stations qui font la cuisine du projet (ticket 983) : nommées en une ligne, avec de quoi en ajouter
           une ; s'il n'en a aucune, une phrase le dit, et le geste qui la lui confie est à côté. Elles sont de
           l'onglet Cooks (ticket 1184) — sauf tant que le projet ne cuit nulle part : elles sont alors ce qui t'attend. -->
      <section id="stations-du-projet" aria-label="Its stations" hidden></section>
      <!-- Ce qui bloque le projet (ticket 1399) : une ligne par blocage, sa phrase, sa cause, son bouton ou le lien qui
           nomme la page où le lever. Sur Rail comme sur Stations ; aucun blocage, rien. -->
      <!-- Ce qui manque à sa station pour ses tests (ticket 1400) : une carte par besoin, ses issues en boutons, ce qui
           suit de chacune sous elle. Au-dessus de ses blocages ; aucun choix qui t'attend, rien. -->
      <section id="choix-du-projet" aria-label="What its station lacks" aria-live="polite" hidden></section>
      <!-- Le temps de l'ajout au premier ticket servi (ticket 1401) : court tant qu'aucun n'est servi, figé ensuite. -->
      <section id="delai-du-projet" aria-label="Time to its first served ticket" hidden></section>
      <!-- L'offre du téléphone (ticket 3303) : sur le premier projet, juste après son premier ticket servi. -->
      <section id="offre-telephone" aria-label="Your phone" hidden></section>
      <section id="blocages-du-projet" aria-label="What blocks it" aria-live="polite" hidden></section>
      <p id="note" aria-live="polite" hidden></p>
      <!-- Le centre : l'onglet montré (ticket 1184). Rail : ce qui t'attend, puis On the rail, TODO, WAITING, Served ;
           Stations : ses stations et leurs réglages. Une page
           ouverte se pose par-dessus, sans le défaire : fermée, elle rend l'onglet tel qu'il était. -->
      <div id="centre">
      <section id="rail" role="tabpanel" aria-label="The rail" hidden></section>
      <!-- La fiche d'un ticket : un clic sur sa carte l'ouvre par-dessus le rail, sans le défaire ; fermée — son
           bouton, ou Échap —, elle rend le rail tel qu'il était. Une page ouverte se pose par-dessus elle aussi. -->
      <section id="fiche" role="dialog" aria-label="The ticket's sheet" tabindex="-1" hidden></section>
      <section id="contenu" hidden>
        <!-- Settings (ticket 1700, 2494) : seulement les réglages du projet.
             Chaque réglage dit sa valeur et a un seul contrôle pour la changer ; ni statistique, ni historique, ni texte
             d'explication. -->
        <section id="etat" aria-label="Settings" hidden>
          <!-- Le projet : ses réglages dans son dépôt (ticket 1309), chacun changé par une PR ; sa
               cuisine, en marche ou à l'arrêt. -->
          <section id="reglages-projet" class="groupe" aria-label="Project">
            <h2 id="niveau-project" class="niveau-du-groupe"></h2>
            <p id="vide-project" class="vide" hidden></p>
            <div id="reglages-du-projet" aria-live="polite" hidden></div>
            <div id="sigle" aria-label="The project's label in the bar" hidden></div>
            <div id="couleurs" aria-label="The project colors" hidden></div>
            <div id="barre-de-menus" aria-label="The kitchen's state in the menu bar" hidden></div>
            <div id="reglages-du-projet-en-plus" aria-live="polite" hidden></div>
            <div id="humains-du-projet" aria-live="polite" hidden></div>
            <div id="stations-contributrices" aria-live="polite" hidden></div>
            <div id="recurrents-du-projet" aria-live="polite" hidden></div>
            <!-- Les explications des mots de la cuisine (ticket 3308) : les remontrer toutes. -->
            <div id="explications-du-chef" hidden></div>
            <div id="retrait" aria-label="Remove this project from the app's sidebar" hidden></div>
          </section>
          <!-- La cuisine, sa section à elle comme dans l'artboard `Settings.dc.html` : sa seule rangée n'est pas entre des réglages. -->
          <section id="reglages-cuisine" class="groupe" aria-label="Kitchen" hidden>
            <h2 id="titre-cuisine" class="niveau-du-groupe">Kitchen</h2>
            <div id="arreter-cuisine" class="gestes" aria-label="The kitchen" hidden></div>
          </section>
          <!-- Les plafonds de durée, le closer et les lignes de tous les projets (tickets 2921, 3013, 3014) : leur section à eux
               de Settings, qui les a repris de la ligne repliée en tête de Stations. -->
          <section id="reglages-sante" class="groupe" aria-label="Caps, closer and all projects">
            <h2 id="titre-sante" class="niveau-du-groupe">Caps, closer and all projects</h2>
            <div id="bandeau-sante"></div>
          </section>
        </section>
        <!-- Ce qui était sous « This machine » (ticket 2494) n'est plus dans Settings, qui ne tient que les réglages du
             projet : ses lignes attendent ici, cachées, que le ticket qui les range dans Stations les y pose. -->
        <div id="reglages-machine" hidden>
          <p id="vide-machine" class="vide" hidden></p>
          <div id="ordinaires" aria-label="Ordinary tickets on this computer" hidden></div>
          <div id="apps-github" aria-label="This station's GitHub Apps" hidden></div>
          <div id="projets-servis" aria-label="The projects this computer serves" hidden></div>
        </div>
        <p id="lu-onglet" aria-live="polite"></p>
        <div id="lecture-onglet"></div>
      </section>
      </div>
      <pre id="message" hidden></pre>
    </main>
    <!-- Les terminaux : à droite, en permanence — le second, et à côté de lui les shells, au même niveau.
         Un shell montré ne remplace pas le second : son onglet le rend, avec sa conversation. -->
    <aside id="second" aria-label="The second and the shells" hidden>
      <header id="tete-du-second">
        <div id="terminaux" role="tablist" aria-label="Terminals"></div>
        <button id="fermer-shell" type="button" data-bouton="discret" title="Closes this shell for good: its session is destroyed on its machine, and it will not come back" hidden></button>
      </header>
      <!-- « + shell » : la machine où l'ouvrir — ce poste, la box, les stations du projet. -->
      <div id="machines" role="group" aria-label="Open a shell on" hidden></div>
      <p id="note-second" aria-live="polite"></p>
      <!-- L'explication du mot « second », la première fois que le chef le rencontre (ticket 3308, explications/). -->
      <div id="explication-second" hidden></div>
      <!-- Le second ne part pas, ou part sans tous ses outils : chacun nommé, et ce qui l'obtient (ticket 1435). -->
      <div id="outils-du-second" hidden></div>
      <p id="bandeau" hidden></p>
      <div id="fil"></div>
      <!-- Quand le second demande de choisir : un bouton par choix, sous son terminal (ticket 1520, second/choix.js). -->
      <div id="choix-du-second" hidden></div>
    </aside>
    </div>
    <p id="relecture" aria-live="polite" hidden></p>
    <section id="avis" aria-live="polite" hidden></section>
    <section id="absence" aria-label="Since you were away" aria-live="polite" hidden></section>
    <section id="visite" aria-label="Tour of a real kitchen" aria-live="polite" hidden></section>
    <section id="projet-d-essai" aria-label="Your sample project" aria-live="polite" hidden></section>
  </body>
</html>
