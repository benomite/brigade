# The pf anchor `brigade`: every outgoing packet of user `brigade` is blocked, except to loopback. The station and
# its agents run as `brigade` and reach the outside through the project's gate alone (HTTPS_PROXY, on loopback);
# the gate runs as root (brigade-gate.plist), which this anchor does not block. Last match wins; `quick` ends it.
block drop out all user brigade
pass out quick on lo0 to lo0 user brigade
