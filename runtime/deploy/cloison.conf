# La cloison d'un projet : un drop-in de brigade@<projet>.service, à copier
# dans /etc/systemd/system/brigade@<projet>.service.d/cloison.conf — projet par
# projet : sans lui, le runtime tourne comme avant et dit que les projets se
# voient. Installation, sondes et recette : docs/runtime.md, « La cloison ».

[Unit]
# Le runtime ne sort que par sa porte : sans elle, il ne démarre pas, et il
# s'arrête avec elle.
Requires=brigade-porte@%i.service
After=brigade-porte@%i.service

[Service]
# --- Les fichiers : chaque lancement part dans `bwrap` (paquet bubblewrap).
Environment=BRIGADE_SANDBOX_BIN=/usr/bin/bwrap
# Ce dont un lancement ne voit qu'une place vide : l'état, le clone et les
# worktrees de tous les projets, leurs secrets et leurs clés. À compléter de
# ce que le compte garde et qu'un cook n'a pas à lire (/home/brigade/.ssh).
Environment=BRIGADE_SANDBOX_HIDDEN=/var/lib/brigade:/etc/brigade
# Le répertoire du compte est rendu en lecture seule : rien de ce qu'un cook
# écrit n'y arrive. Ce qui s'y écrit — les caches — est au projet. Une chaîne
# d'outils qui écrit sous ~ se nomme ici, par son entrée (.cargo:.gradle).
#Environment=BRIGADE_SANDBOX_PRIVATE=<nom>:<nom>
# Un /tmp par projet, vidé à l'arrêt du service.
PrivateTmp=yes

# --- Le réseau : l'unité ne joint que la boucle locale. Sa seule sortie est
# la porte du projet, qui tient la liste blanche. La boucle locale reste
# entière : les ports que le setup exporte se joignent comme avant.
IPAddressDeny=any
IPAddressAllow=localhost
# Le port de la porte : le même que dans le drop-in de
# brigade-porte@<projet>.service. Un par projet, aucun défaut.
#Environment=BRIGADE_PROXY_PORT=<port>
