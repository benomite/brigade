name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please search the existing issues first.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Android
        - Other (say which below)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Brigade version
      description: The plugin version (`.claude-plugin/plugin.json`), the app version, or the commit of the runtime.
      placeholder: "0.17.0"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: Include the exact message, the command you ran and any relevant lines of the log.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: false
