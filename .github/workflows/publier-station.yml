# Publie la station : à chaque merge sur la branche d'intégration qui change ce que le paquet porte
# (le runtime livré et `runtime/paquet/`), une release `station-<version>` avec
# `installer-station.sh` (runtime/deploy/, la commande d'installation sous Linux et macOS),
# `installer-station.ps1` (runtime/deploy/windows/, celle de Windows),
# `brigade-station_amd64.deb` et sa copie `brigade-station-linux-amd64.deb`,
# `brigade-station-mac.tar.gz` — le runtime que le paquet porte, pour macOS — et
# `brigade-station-windows.zip` — le même, pour Windows —, avec des notes qui disent la plateforme. La version est celle que
# `construire.ts` se donne sans `--version` : `0.<AAAAMMJJ>.<HHMMSS>+g<commit>`.
# Un merge qui ne touche que l'app, la doc ou le plugin V1 ne publie rien.
# `workflow_dispatch` publie le commit choisi, à la main.
name: publier-station

on:
  push:
    branches: [main]
    paths:
      - "runtime/src/**"
      - "runtime/package.json"
      - "runtime/deploy/**"
      - "runtime/paquet/**"
      - ".github/workflows/publier-station.yml"
      - "scripts/app-release/paquets.ts"
  workflow_dispatch:

# Deux publications ne se doublent pas : la dernière release du dépôt doit être la
# plus récente.
concurrency:
  group: publier-station
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Construire le paquet
        env:
          BRIGADE_PAQUET_DEPOT: ${{ github.repository }}
          BRIGADE_PAQUET_MAINTENEUR: ${{ github.repository_owner }} <${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com>
        run: node runtime/paquet/construire.ts --sortie "$RUNNER_TEMP/paquet"
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          deb=$(ls "$RUNNER_TEMP"/paquet/brigade-station_*_amd64.deb)
          version=$(basename "$deb" _amd64.deb)
          version=${version#brigade-station_}
          tag="station-$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "La release $tag existe déjà : rien à publier."
            exit 0
          fi
          # `brigade-station_amd64.deb` est lu par son nom (installer-station.sh, stations installées) ;
          # sa copie `brigade-station-linux-amd64.deb` dit la plateforme (scripts/app-release/paquets.ts).
          cp "$deb" "$RUNNER_TEMP/brigade-station_amd64.deb"
          cp "$deb" "$RUNNER_TEMP/brigade-station-linux-amd64.deb"
          # Le runtime du paquet, tel quel (son package.json porte la version) : ce que
          # installer-station.sh pose sur un Mac, à côté du node qu'il y télécharge.
          dpkg-deb -x "$deb" "$RUNNER_TEMP/deb"
          tar -C "$RUNNER_TEMP/deb/usr/lib/brigade-station" -czf "$RUNNER_TEMP/brigade-station-mac.tar.gz" runtime
          # Le même runtime, zippé : ce que runtime/deploy/windows/installer-station.ps1 pose sur un PC.
          (cd "$RUNNER_TEMP/deb/usr/lib/brigade-station" && zip -qr "$RUNNER_TEMP/brigade-station-windows.zip" runtime)
          node scripts/app-release/paquets.ts notes --produit station --version "$version" --commit "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
          sed "s#@DEPOT@#$GITHUB_REPOSITORY#" runtime/deploy/installer-station.sh >"$RUNNER_TEMP/installer-station.sh"
          sed "s#@DEPOT@#$GITHUB_REPOSITORY#" runtime/deploy/windows/installer-station.ps1 >"$RUNNER_TEMP/installer-station.ps1"
          gh release create "$tag" \
            "$RUNNER_TEMP/installer-station.sh" \
            "$RUNNER_TEMP/installer-station.ps1" \
            "$RUNNER_TEMP/brigade-station_amd64.deb" \
            "$RUNNER_TEMP/brigade-station-linux-amd64.deb" \
            "$RUNNER_TEMP/brigade-station-mac.tar.gz" \
            "$RUNNER_TEMP/brigade-station-windows.zip" \
            --target "$GITHUB_SHA" \
            --title "Station $version" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
