# Publie la station : à chaque merge sur la branche d'intégration qui change ce que le paquet porte
# (le runtime livré et `runtime/paquet/`), une release `station-<version>` avec
# `brigade-station-<version>-linux-x64.tar.gz` et `brigade-station-<version>-darwin-arm64.tar.gz`
# (construites par `construire.ts` : runtime, node, services ; on les installe par leur `install.sh`)
# et `brigade-station_amd64.deb`, le pont à sens unique vers l'archive (#4741), avec des notes qui disent la plateforme. La version est celle que
# `construire.ts` se donne sans `--version` : `0.<AAAAMMJJ>.<HHMMSS>+g<commit>`.
# Aucune release de la station n'est « latest » : c'est l'app, pour que le lien de téléchargement du
# README et du site (`releases/latest`) mène à elle. La station a son adresse stable, la release
# de tag `station`, dont les fichiers sont remplacés à chaque publication.
# Un merge qui ne touche que l'app, la doc ou le plugin V1 ne publie rien.
# `workflow_dispatch` publie le commit choisi, à la main.
name: publier-station

on:
  push:
    branches: [main]
    paths:
      - "runtime/src/**"
      - "runtime/package.json"
      - "runtime/paquet/**"
      - ".github/workflows/publier-station.yml"
      - "scripts/app-release/paquets.ts"
  workflow_dispatch:

# Deux publications ne se doublent pas : la dernière release du dépôt doit être la
# plus récente.
concurrency:
  group: publier-station
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Construire le paquet
        env:
          BRIGADE_PAQUET_DEPOT: ${{ github.repository }}
          BRIGADE_PAQUET_MAINTENEUR: ${{ github.repository_owner }} <${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com>
        run: node runtime/paquet/construire.ts --sortie "$RUNNER_TEMP/paquet"
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          deb=$(ls "$RUNNER_TEMP"/paquet/brigade-station_*_amd64.deb)
          version=$(basename "$deb" _amd64.deb)
          version=${version#brigade-station_}
          tag="station-$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "La release $tag existe déjà : rien à publier."
            exit 0
          fi
          # Le pont `brigade-station_amd64.deb` est lu par son nom par la mise à jour des stations qui
          # font encore tourner le .deb : à retirer quand plus aucune station ne le fait (#4742).
          cp "$deb" "$RUNNER_TEMP/brigade-station_amd64.deb"
          # Les archives de la station, une par plateforme, écrites à côté du .deb par construire.ts.
          cp "$RUNNER_TEMP/paquet/brigade-station-$version-linux-x64.tar.gz" "$RUNNER_TEMP/paquet/brigade-station-$version-darwin-arm64.tar.gz" "$RUNNER_TEMP/"
          node scripts/app-release/paquets.ts notes --produit station --version "$version" --commit "$GITHUB_SHA" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
          gh release create "$tag" \
            "$RUNNER_TEMP/brigade-station_amd64.deb" \
            "$RUNNER_TEMP/brigade-station-$version-linux-x64.tar.gz" \
            "$RUNNER_TEMP/brigade-station-$version-darwin-arm64.tar.gz" \
            --target "$GITHUB_SHA" \
            --title "Station $version" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest=false
          # L'adresse stable : la release `station` reçoit les mêmes archives à chaque publication, sous
          # un nom sans version, `releases/download/station/brigade-station-linux-x64.tar.gz` donne donc
          # toujours la dernière station, quelle que soit la release « latest » (l'app). Son tag ne commence pas
          # par `station-` : les stations installées ne la prennent pas pour une version.
          git tag -f station "$GITHUB_SHA"
          git push -f origin refs/tags/station
          cp "$RUNNER_TEMP/brigade-station-$version-linux-x64.tar.gz" "$RUNNER_TEMP/brigade-station-linux-x64.tar.gz"
          cp "$RUNNER_TEMP/brigade-station-$version-darwin-arm64.tar.gz" "$RUNNER_TEMP/brigade-station-darwin-arm64.tar.gz"
          fichiers=("$RUNNER_TEMP/brigade-station_amd64.deb" "$RUNNER_TEMP/brigade-station-linux-x64.tar.gz" "$RUNNER_TEMP/brigade-station-darwin-arm64.tar.gz")
          if gh release view station >/dev/null 2>&1; then
            gh release upload station "${fichiers[@]}" --clobber
            gh release edit station --title "Station (latest: $version)" --notes-file "$RUNNER_TEMP/notes.md" --latest=false
          else
            gh release create station "${fichiers[@]}" \
              --verify-tag \
              --title "Station (latest: $version)" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --latest=false
          fi
          # Seules les 5 dernières releases de la station restent, tags compris (`station` n'a pas le préfixe `station-` : elle reste).
          GH_REPO="$GITHUB_REPOSITORY" scripts/app-release/garder-les-dernieres.sh station- 5
