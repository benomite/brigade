# Publie l'app de Windows : sur un tag `app-v<version>` (le même que celui du Mac, ex. `app-v1.0.0`),
# construit sur un runner Windows l'installeur Brigade-<version>-x64-setup.exe, le signe avec un
# certificat de signature de code, vérifie la signature (Get-AuthenticodeSignature doit dire Valid),
# écrit `latest.yml` pour l'installeur signé, puis attache les deux à la release du tag, à côté du
# .dmg et de `latest-mac.yml` que publie publier-app.yml. Ce workflow-ci n'y touche pas.
# Le détail : app/packaging/WINDOWS.md.
#
# Secrets du dépôt requis (aucune valeur n'est dans le dépôt, aucune n'est jamais affichée) :
#   WINDOWS_CERTIFICATE_PFX        le certificat de signature de code et sa clé, .pfx en base64
#   WINDOWS_CERTIFICATE_PASSWORD   le mot de passe de ce .pfx
# Sans l'un des deux, le workflow échoue avant de rien construire, et ne publie rien.
name: publier-app-windows

on:
  push:
    tags:
      - "app-v*"

permissions:
  contents: write

jobs:
  publier:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Vérifier que le certificat est fourni
        shell: bash
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          for v in WINDOWS_CERTIFICATE_PFX WINDOWS_CERTIFICATE_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::the repository secret $v is not set — the Windows installer is not built, nothing is published"; exit 1; }
          done
      - name: Garder les fins de ligne du dépôt
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Construire l'installeur
        shell: bash
        run: |
          set -euo pipefail
          node app/packaging/windows.ts --version "${TAG#app-v}" --sortie "$RUNNER_TEMP/dist"
      - name: Signer l'installeur
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:TAG.Substring('app-v'.Length)
          $installeur = Join-Path $env:RUNNER_TEMP "dist/Brigade-$version-x64-setup.exe"
          if (-not (Test-Path $installeur)) { throw "the installer $installeur was not built" }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found on this runner' }
          $pfx = Join-Path $env:RUNNER_TEMP 'certificat.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $installeur
            if ($LASTEXITCODE -ne 0) { throw "signtool sign exited with $LASTEXITCODE" }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
      - name: Écrire latest.yml pour l'installeur signé
        shell: bash
        run: |
          set -euo pipefail
          # Signer change les octets de l'installeur : l'empreinte et la taille de latest.yml
          # (écrit par la construction, avant la signature) sont celles de l'installeur signé.
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            import { metadonneesDeMiseAJour } from "./app/packaging/construire.ts";
            const [version, installeur, yml] = process.argv.slice(1);
            writeFileSync(yml, metadonneesDeMiseAJour(version, installeur, new Date().toISOString()));
          ' "${TAG#app-v}" "$RUNNER_TEMP/dist/Brigade-${TAG#app-v}-x64-setup.exe" "$RUNNER_TEMP/dist/latest.yml"
          cat "$RUNNER_TEMP/dist/latest.yml"
      - name: Vérifier la signature
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:TAG.Substring('app-v'.Length)
          $installeur = Join-Path $env:RUNNER_TEMP "dist/Brigade-$version-x64-setup.exe"
          $signature = Get-AuthenticodeSignature -FilePath $installeur
          Write-Host "Status: $($signature.Status) — $($signature.StatusMessage)"
          Write-Host "Signer: $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid') {
            throw "the installer's signature is $($signature.Status) ($($signature.StatusMessage)), not Valid — nothing is published"
          }
      - name: Joindre l'installeur et les métadonnées à la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          installeur="$RUNNER_TEMP/dist/Brigade-${TAG#app-v}-x64-setup.exe"
          test -f "$installeur"
          test -f "$RUNNER_TEMP/dist/latest.yml"
          # La release peut être créée en même temps par publier-app (le Mac) : on la crée si elle
          # manque, et si quelqu'un l'a créée entre-temps, on y joint nos fichiers.
          for essai in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "$installeur" "$RUNNER_TEMP/dist/latest.yml" --clobber && exit 0
            else
              gh release create "$TAG" "$installeur" "$RUNNER_TEMP/dist/latest.yml" --title "Brigade ${TAG#app-v}" --notes "L'app de Windows, signée. Lancer l'installeur Brigade-${TAG#app-v}-x64-setup.exe." && exit 0
            fi
            sleep $((essai * 5))
          done
          echo "::error::the installer could not be attached to the release $TAG"
          exit 1
