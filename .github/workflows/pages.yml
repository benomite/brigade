# Le site public de brigade (#1553, #2872) : `site/` est publié sur GitHub Pages, et rien d'autre du dépôt
# (l'artefact est `site/` lui-même, vérifié par runtime/test/pages-site.test.ts).
# Les chiffres d'autonomie (#3220) y sont régénérés chaque jour : docs/autonomie-page.md.
# Réglage à activer une fois par le chef : Settings → Pages → Source : GitHub Actions.
name: pages

# Aucun `push` hors de `main` : une branche de cook ne déclenche ce workflow qu'en tête d'une PR (règle dans tests.yml, #3996).
on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
  pull_request:
    paths: [site/**, .github/workflows/pages.yml]
  # The daily refresh of the autonomy page (#3220): same build, same deploy, so no deploy can drop site/autonomie.json.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Un check qu'un merge attend sur une PR qui touche `site/` : plafonné à 3 min (#2086), il rend son verdict en 10 à 25 s.
    # Hors PR, les chiffres d'autonomie se lisent sur GitHub en 1 à 2 min : 10 min.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 3 || 10 }}
    # The generator reads the issues and pull requests of this repository with the workflow's own token, read only.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      # The autonomy figures (#4500): site/autonomie.json as docs/autonomie-page.md describes, over the last 30 days.
      # Figures that cannot be computed fail the step, and nothing is deployed: the page last published stays.
      # Not on a PR: its artifact is never deployed, and its check stays within its 3 min.
      - if: github.event_name != 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Generate the autonomy figures
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/autonomy-page/generate.ts site/autonomie.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Le déploiement ne se joue que depuis main ; sur une PR, seul l'artefact est construit.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
