# Joue la suite de tests du runtime sous Windows (#1242, épique #1241) : le filet de sécurité des
# tickets de port de la station sur un PC. `npm test` suppose un shell POSIX : le job passe par
# runtime/test/support/windows.ts, qui joue tous les fichiers. Les tests propres à Linux ou à macOS se
# sautent eux-mêmes, avec leur raison dans le journal (runtime/test/support/plateforme.ts). Entière, la
# suite est trop longue pour un seul job sous Windows : elle se joue en
# huit parts, une par runner, qui ensemble couvrent chaque fichier une fois (`--part`). À quatre, deux
# parts dépassaient le plafond du job sur b1d0e1d (#2406) : la suite était passée de 370 à 429 fichiers
# depuis le 2 novembre, où la part 2 prenait déjà 11 min 28 s. Coupé par GitHub, un job ne laisse ni
# annotation ni sortie. Le garde de la part (windows.ts, GARDE_MS) tombe avant ce plafond, pour nommer
# ce qui cale ; test/support/windows.test.ts tient les deux d'accord. Chaque part
# finit par ses échecs, ses tests sautés et ses comptes en annotations du check, lisibles par l'API de
# GitHub sans le journal du job (runtime/test/support/annotations.ts) :
#   gh api repos/<dépôt>/check-runs/<job>/annotations
# Le job tourne sur `main` (push, sans condition de chemin : la base a un statut Windows pour chacun
# de ses commits, #1859), à la demande (`workflow_dispatch`) et sur les PR qui touchent ce que ces
# tests couvrent (#2695, épique #2661). Il avait quitté les PR (#2087), et 5 des 7 réparations de
# `main` des 5 au 7 novembre étaient des tests Windows (#2538, #2608, #2614, #2616, #2625) : une PR
# qui les cassait était fusionnée verte, `main` rougissait après. Le job porte le même nom sur la PR et
# sur `main` (`windows tests (n/8)`), pour que la liste des checks reste cohérente ; sur une PR dont
# les fichiers sont tous hors de la liste ci-dessous, aucun job ne démarre.
#
# La liste des chemins (`pull_request.paths`), par groupe et pourquoi :
#   - runtime/** : les sources du runtime et les tests Windows eux-mêmes. Les réparations #2538
#     (runtime/test/github-seul/setup-du-cook.test.ts), #2614 et #2616 (runtime/test/installation.test.ts)
#     et #2625 (runtime/test/station/cuisine-github-seul.test.ts) sont des tests ; leurs PR cassantes
#     (#2535, #2464, #2622) changeaient runtime/src/ (brigade-github.ts, main.ts, station/*.ts) et des
#     tests du runtime.
#   - app/** : les tests de l'app jouent aussi sous Windows ; #2608 (app/test/plugin-app.test.ts) et
#     #2636 (app/test/poste/station.test.ts) en sont issus, et leurs PR cassantes (#2606,
#     #2479) changeaient app/src/vue/ (rail/github.ts, parcours-projet/*, vue.css, vue.js).
#   - docs/runtime/** : des tests du runtime relisent ces pages (ex. exploitation-en-anglais.test.ts) ;
#     #2535 et #2464 en ont changé (station.md, station-machine.md, settings-ownership.md).
#   - .claude/brigade/** : les scripts de gates et de setup que les tests du runtime jouent sous le
#     bash de Git (setup-du-cook, installation).
#   - ce fichier : un changement du workflow doit être éprouvé par lui-même.
# Quand un test Windows casse `main`, étendre cette liste avec les fichiers de la PR cassante et de la
# réparation qui n'y sont pas encore, et le dire dans la PR de la réparation.
name: runtime-windows

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "runtime/**"
      - "app/**"
      - "docs/runtime/**"
      - ".claude/brigade/**"
      - ".github/workflows/runtime-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    # « windows » en tête, même nom sur la PR et sur `main` (#2695).
    name: windows tests (${{ matrix.part }}/8)
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      # Une part rouge n'arrête pas les autres : le job dit tout ce qui casse sous Windows, en un run.
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      # Git for Windows extrait en `\r\n` par défaut : les tests qui relisent une source ou une doc
      # du dépôt y attendent les `\n` du dépôt.
      - name: Garder les fins de ligne du dépôt
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # Le bash de Git écrit « could not find /tmp, please create! » dans la sortie des gates quand
      # `/tmp` manque, et casse les tests qui en comparent la fin (pass.test.ts, run 40751190357).
      - name: Créer /tmp pour le bash de Git
        shell: bash
        run: mkdir -p /tmp
      - name: Tests du runtime
        working-directory: runtime
        run: node test/support/windows.ts --part ${{ matrix.part }}/8
