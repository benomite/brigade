# Joue la suite de tests du runtime sous Windows (#1242, épique #1241) : le filet de sécurité des
# tickets de port de la station sur un PC. `npm test` suppose un shell POSIX : le job passe par
# runtime/test/support/windows.ts, qui joue tous les fichiers. Les tests propres à Linux ou à macOS se
# sautent eux-mêmes, avec leur raison dans le journal (runtime/test/support/plateforme.ts). Entière, la
# suite est trop longue pour un seul job sous Windows : elle se joue en
# quatre parts, une par runner, qui ensemble couvrent chaque fichier une fois (`--part`). Chaque part
# finit par ses échecs, ses tests sautés et ses comptes en annotations du check, lisibles par l'API de
# GitHub sans le journal du job (runtime/test/support/annotations.ts) :
#   gh api repos/<dépôt>/check-runs/<job>/annotations
# Le job tourne aussi à chaque push sur `main`, sans condition de chemin : la base a ainsi un statut
# Windows pour chacun de ses commits (#1859). Le job ne bloque pas la fusion (#2087) : `continue-on-error`
# garde le signal (la part rouge se lit dans le run et ses annotations) sans que la pass l'attende en vert.
# Les causes restantes et la condition pour le rendre à nouveau bloquant : #2112.
name: runtime-windows

on:
  pull_request:
    paths:
      - "runtime/**"
      - ".github/workflows/runtime-windows.yml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Une PR remplace son run en cours. Un push sur la base a son groupe par commit et n'est jamais annulé :
# avec un groupe par ref, GitHub écarterait le run en attente et un commit de `main` resterait sans statut.
concurrency:
  group: runtime-windows-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: tests (${{ matrix.part }}/4)
    runs-on: windows-latest
    timeout-minutes: 15
    # GitHub rend la conclusion `success` à un job en échec sous `continue-on-error` : la pass, qui lit les
    # conclusions des check-runs (runtime/src/github.ts), ne le voit plus comme un rouge. Voir #2112.
    continue-on-error: true
    strategy:
      # Une part rouge n'arrête pas les autres : le job dit tout ce qui casse sous Windows, en un run.
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      # Git for Windows extrait en `\r\n` par défaut : les tests qui relisent une source ou une doc
      # du dépôt y attendent les `\n` du dépôt.
      - name: Garder les fins de ligne du dépôt
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # Le bash de Git écrit « could not find /tmp, please create! » dans la sortie des gates quand
      # `/tmp` manque, et casse les tests qui en comparent la fin (pass.test.ts, run 40751190357).
      - name: Créer /tmp pour le bash de Git
        shell: bash
        run: mkdir -p /tmp
      - name: Tests du runtime
        working-directory: runtime
        run: node test/support/windows.ts --part ${{ matrix.part }}/4
