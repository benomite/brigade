# Joue la suite du runtime sur Windows (#1153) : à chaque PR qui touche runtime/ (ou ce fichier),
# et à la demande. Le runtime n'y demande que Node et Git — le bash de Git joue les scripts du
# projet (gates, setup) et les doublures des tests. npm y joue ses scripts par ce même bash,
# comme sur macOS et Linux.
#
# Les deux premières étapes sont les preuves de la station Windows : l'arbre d'un cook arrêté
# ne laisse aucun process (test/arbre.test.ts), et une station cuisine de bout en bout — son
# worktree, son cook, sa livraison (test/station/main.test.ts). La dernière joue toute la suite.
name: runtime-windows

on:
  pull_request:
    paths:
      - "runtime/**"
      - ".github/workflows/runtime-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Jouer les scripts npm par le bash de Git
        run: npm config set script-shell "$(cygpath -w "$(command -v bash)")"
      - name: L'arbre d'un cook arrêté ne laisse aucun process
        run: node --test --test-force-exit --test-timeout=120000 runtime/test/arbre.test.ts
      - name: Une station cuisine de bout en bout
        run: node --test --test-force-exit --test-timeout=120000 runtime/test/station/main.test.ts
      - name: Toute la suite du runtime
        run: npm --prefix runtime test
