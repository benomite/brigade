# Joue les tests de l'app et son contrôle de types sous Windows (#1154) : l'app tourne sur un PC avec
# les mêmes écrans et les mêmes gestes que sur le Mac. À chaque push sur `main` qui touche app/ (ou ce
# fichier), et à la demande. Les dépendances sont posées sans leurs scripts, comme par le setup de worktree : pas
# de binaire d'Electron, qu'aucun test ne lance. Les tests dont les doublures sont des scripts POSIX
# (`#!/bin/sh`, un `.ts` à shebang) sont sautés là, en le disant (app/test/aides/posix.ts).
# Le job `installeur` construit l'installeur Windows et l'éprouve (plus bas) ; rien n'y est signé ni publié :
# ce sont d'autres tickets (#1156, #1157).
# Pas sur `pull_request` (#2086) : un check qu'une PR attend rend son verdict dans les 60 s du départ
# de son job, et `tests` (104 à 135 s) comme `installeur` (287 à 363 s) les dépassent ; la suite de
# l'app sous Linux reste jouée sur chaque PR par le workflow `tests`.
name: app-windows

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/app-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

# Un push sur la base a son groupe par commit et n'est jamais annulé : chaque commit de `main` garde
# son statut.
concurrency:
  group: app-windows-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # Un plafond de durée (#1645), de 3 min depuis #2086 : le job passe en deux minutes, ses tests en
  # moins d'une et demie ; un test qui pend sous Windows (le plafond de 120 s par test ne tient pas un
  # process fils resté vivant) rendait le check
  # silencieux jusqu'aux six heures de GitHub, et la pass le remontait au chef comme `ci-silent`.
  # Passé le plafond du pas, le job est rouge, et son journal dit lequel : `test:en-cours` joue la
  # même suite avec un reporter qui écrit chaque DEBUT de test (app/test/aides/reporter-en-cours.ts) ;
  # le dernier DEBUT sans FIN du journal est le test qui bloque.
  tests:
    # « windows » en tête : la station GitHub seul ne lit pas ces checks pour
    # l'état de la base — ils ne tournent que sur `main` et n'y bloquent rien (#2240).
    name: windows app tests
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      # Git for Windows extrait en `\r\n` par défaut : les tests qui relisent une source ou une doc
      # du dépôt y attendent les `\n` du dépôt.
      - name: Garder les fins de ligne du dépôt
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Installer les dépendances de l'app
        run: npm ci --ignore-scripts --prefix app
      - name: Tests de l'app
        timeout-minutes: 2
        run: npm --prefix app run test:en-cours
      - name: Contrôle de types de l'app
        run: npm --prefix app run typecheck

  # L'installeur Windows (#1155), de bout en bout sur un Windows : construit depuis le clone tel quel
  # (la commande pose elle-même les dépendances de l'app), installé sans rien demander, l'app ouverte
  # par son raccourci sans aucun `node` dans le PATH jusqu'à son écran principal, puis désinstallée
  # (app/packaging/essai-windows.ts). La capture de la fenêtre et l'installeur restent une semaine
  # dans les artefacts du run : de quoi l'essayer sur un vrai PC.
  installeur:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Garder les fins de ligne du dépôt
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Construire l'installeur
        run: node app/packaging/windows.ts --version 0.0.1
      - name: Installer, ouvrir et désinstaller l'app
        run: node app/packaging/essai-windows.ts app/packaging/construit/Brigade-0.0.1-x64-setup.exe --capture essai-windows.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installeur-windows
          path: |
            essai-windows.png
            app/packaging/construit/Brigade-0.0.1-x64-setup.exe
            app/packaging/construit/latest.yml
          if-no-files-found: ignore
          retention-days: 7
