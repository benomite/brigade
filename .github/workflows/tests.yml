# Les gates entières, sur GitHub Actions (#1004) : sur une PR se jouent tous les tests que le
# changement touche — ceux que la station qui cuisine a joués avant de livrer (#2565) —, et sur `main`
# après un merge, la suite entière (le diff y est vide). La pass attend ces checks avant de merger. Le dépôt est public : les runners de GitHub n'y coûtent rien.
#
# #4607 : une PR ne lance que le CI que son diff demande. Le job `plan` lit le diff (`tests-touches.mjs`) et
# donne à `tests` et à `types` leur matrice : une zone dont aucun test n'est touché n'a aucune part, une
# zone dont aucun fichier n'a changé n'a pas de contrôle de types, et le nombre de parts suit le nombre de
# fichiers à jouer, plafonné (3 pour le runtime, 2 pour l'app : au plus 8 jobs par PR, `plan` et `gates`
# compris). Sur `main`, tout se joue, en 16 + 3 parts. Windows ne joue que sur `main` (runtime-windows.yml).
#
# Chaque check rend son verdict en moins de 60 s après le démarrage de son job (#2086) : la suite est
# coupée en parts qui courent en parallèle, une part rouge arrête les autres (`fail-fast`), les
# dépendances viennent du cache de npm, et `timeout-minutes: 3` plafonne un job qui pend. Les checks :
#   - `gates`                          : les gates du dépôt, sans leurs suites (jouées par les parts) ;
#   - `tests <zone> (<i>/<n>)`         : la part i de n des tests de la zone, ceux que la PR touche ;
#   - `types (<zone>)`                 : le contrôle de types de la zone.
# Le nombre de parts se règle dans la matrice de `tests` : plus de parts, des parts plus courtes.
name: tests

# Une branche de cook ne déclenche ce workflow qu'en tête d'une PR ouverte (`pull_request`) : aucun `push`
# hors de `main`. La station n'y pousse qu'une livraison pour la pass, une fois ses gates vertes (#3996).
# Le travail d'un cook qui n'est pas une livraison — arrêté sur une question, sauvé avant une relance — est
# garé sous `refs/brigade/parked/<branche>` : ni une branche, ni la tête d'une PR, il ne déclenche rien.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # PR branches: one group per ref, a new push replaces the old run. main: one group per
  # commit (a group keeps only one pending run), so every merge gets its verdict.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Ce que le diff demande (#4607) : les matrices de `tests` et de `types`. Sur `main`, tout.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      tests: ${{ steps.plan.outputs.tests }}
      types: ${{ steps.plan.outputs.types }}
    steps:
      # Deux commits suffisent : sur une PR, le premier parent du commit de merge est la base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Plan
        id: plan
        env:
          EVENEMENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENEMENT" != pull_request ]; then
            echo 'tests={"include":[{"zone":"runtime","of":16,"part":1},{"zone":"runtime","of":16,"part":2},{"zone":"runtime","of":16,"part":3},{"zone":"runtime","of":16,"part":4},{"zone":"runtime","of":16,"part":5},{"zone":"runtime","of":16,"part":6},{"zone":"runtime","of":16,"part":7},{"zone":"runtime","of":16,"part":8},{"zone":"runtime","of":16,"part":9},{"zone":"runtime","of":16,"part":10},{"zone":"runtime","of":16,"part":11},{"zone":"runtime","of":16,"part":12},{"zone":"runtime","of":16,"part":13},{"zone":"runtime","of":16,"part":14},{"zone":"runtime","of":16,"part":15},{"zone":"runtime","of":16,"part":16},{"zone":"app","of":3,"part":1},{"zone":"app","of":3,"part":2},{"zone":"app","of":3,"part":3}]}' >> "$GITHUB_OUTPUT"
            echo 'types={"include":[{"zone":"runtime"},{"zone":"app"}]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changes="$(git diff --name-only HEAD^1 HEAD)"
          sel="$(printf '%s\n' "$changes" | node .claude/brigade/tests-touches.mjs --souche HEAD^1)" \
            || { echo "tests-touches.mjs a échoué : sélection des tests impossible" >&2; exit 1; }
          node --input-type=module -e '
            const [sel, changes] = process.argv.slice(1).map((s) => s.split("\n"));
            const cap = { runtime: 3, app: 2 };
            const tests = [], types = [];
            // Un diff tout en docs/ ne lance aucune part : les tests qui relisent une page se jouent sur `main`.
            const docs = changes.filter(Boolean).every((c) => c.startsWith("docs/"));
            for (const zone of docs ? [] : ["runtime", "app"]) {
              const regle = sel.find((l) => l.startsWith(zone + " "))?.slice(zone.length + 1);
              if (regle === undefined) throw new Error("tests-touches.mjs ne dit rien de la zone " + zone);
              const max = cap[zone];
              const n = regle === "rien" ? 0 : regle.startsWith("fichiers ") ? regle.slice(9).split(" ").filter(Boolean).length : Infinity;
              const parts = Math.min(max, Math.ceil(n / 50));
              for (let part = 1; part <= parts; part++) tests.push({ zone, part, of: parts });
              const dossiers = zone === "runtime" ? ["runtime/", "scripts/"] : ["app/"];
              if (changes.some((c) => dossiers.some((d) => c.startsWith(d)))) types.push({ zone });
            }
            const sortie = (nom, include) => console.log(nom + "=" + JSON.stringify({ include }));
            sortie("tests", tests); sortie("types", types);
          ' "$sel" "$changes" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
  # Les gates sans leurs suites : sans `package.json`, une zone n'a « aucun test à jouer » (ce n'est
  # pas un échec) et ses types ne partent pas. Les suites se jouent dans `tests`, les types dans `types`.
  # Ce contournement est fragile : il suppose que `gates.sh` traite une zone sans `package.json` comme
  # absente. Si `gates.sh` change, la suppression ci-dessous est à revoir.
  # `gates` est le seul verdict : la pass le connaît comme vert sur `main` et n'excuse pas son rouge.
  # Il attend `tests` et `types` (`always()` : même quand l'un échoue ou est annulé par `fail-fast`)
  # et est rouge si l'un d'eux n'est ni `success` ni `skipped` (aucune part : rien à jouer, #4607).
  gates:
    needs: [plan, tests, types]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Tout l'historique : les gates lisent leur diff depuis `origin/<base>` (binding « Branche d'intégration » du CLAUDE.md).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Verdict de tests et de types
        run: |
          test "${{ needs.plan.result }}" = success || { echo "plan : ${{ needs.plan.result }}" >&2; exit 1; }
          case "${{ needs.tests.result }}" in success|skipped) ;; *) false ;; esac || { echo "tests : ${{ needs.tests.result }}" >&2; exit 1; }
          case "${{ needs.types.result }}" in success|skipped) ;; *) false ;; esac || { echo "types : ${{ needs.types.result }}" >&2; exit 1; }
      - name: Gates (suites et types joués par les autres jobs)
        run: |
          rm runtime/package.json app/package.json
          .claude/brigade/gates.sh "$PWD"

  types:
    name: types (${{ matrix.zone }})
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.types).include[0] != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.types) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ${{ matrix.zone }}/package-lock.json
      # Comme le setup de worktree : celles de l'app sans leurs scripts (pas de binaire d'Electron).
      - name: Dépendances
        run: npm ci --ignore-scripts --prefix ${{ matrix.zone }}
      - name: Contrôle de types
        run: npm --prefix ${{ matrix.zone }} run typecheck

  tests:
    name: tests ${{ matrix.zone }} (${{ matrix.part }}/${{ matrix.of }})
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.tests).include[0] != null }}
    runs-on: ubuntu-latest
    # Sur une PR, peu de parts et plus de fichiers chacune (#4607) : le plafond de 3 min est celui de `main`.
    timeout-minutes: 15
    strategy:
      # Une part rouge arrête les autres : le verdict ne se fait pas attendre.
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.tests) }}
    steps:
      # Deux commits suffisent : sur une PR, le premier parent du commit de merge est la base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # `origin/main` : des tests relisent la base (regles-claude-md/2-…, #4016), que le checkout ne pose pas.
      - name: Base origin/main
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ${{ matrix.zone }}/package-lock.json
      - name: Dépendances
        run: npm ci --ignore-scripts --prefix ${{ matrix.zone }}
      # Les fichiers de la part : ceux que la PR touche (`tests-touches.mjs`, comme les gates), ou tous
      # sur `main`, où le diff est vide. Le script `test` de la zone y remplace son motif par la part.
      - name: Tests
        env:
          ZONE: ${{ matrix.zone }}
          PART: ${{ matrix.part }}
          OF: ${{ matrix.of }}
          EVENEMENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          regle="tout"
          if [ "$EVENEMENT" = pull_request ]; then
            sel="$(git diff --name-only HEAD^1 HEAD | node .claude/brigade/tests-touches.mjs --souche HEAD^1)" \
              || { echo "tests-touches.mjs a échoué : sélection des tests impossible" >&2; exit 1; }
            regle="$(printf '%s\n' "$sel" | sed -n "s/^$ZONE //p")"
            [ -n "$regle" ] || { echo "tests-touches.mjs ne dit rien de la zone $ZONE : sortie '$sel'" >&2; exit 1; }
          fi
          case "$regle" in
            rien) echo "aucun test de $ZONE ne touche ce changement"; exit 0 ;;
            "fichiers "*) liste="$(printf '%s\n' ${regle#fichiers } | sort)" ;;
            *) liste="$(cd "$ZONE" && git ls-files ':(glob)test/**/*.test.ts' | sort)" ;;
          esac
          fichiers="$(printf '%s\n' "$liste" | awk -v i="$PART" -v n="$OF" 'NR % n == i % n' | tr '\n' ' ')"
          if [ -z "${fichiers// /}" ]; then echo "part $PART/$OF : aucun fichier"; exit 0; fi
          motif='"test/**/*.test.ts"'
          commande="$(node -e 'console.log(require(process.argv[1]).scripts.test)' "$PWD/$ZONE/package.json")"
          case "$commande" in *"$motif"*) ;; *) echo "le script test de $ZONE n'a plus son motif $motif" >&2; exit 1 ;; esac
          echo "part $PART/$OF : $(set -- $fichiers; echo $#) fichiers"
          # L'environnement que `gates.sh` donne à ses suites, celui où elles étaient vertes sur `main` :
          # pas d'entrée, pas de proxy de Node, ni les variables de ce job ; le répertoire temporaire en
          # mémoire, le cache de compilation à sa place.
          export NODE_COMPILE_CACHE="${NODE_COMPILE_CACHE:-${TMPDIR:-/tmp}/brigade-runtime-compile-cache}"
          # La garde des 2 s (#2322) : sur une PR, elle ne fait échouer que les tests que la PR ajoute ou change ;
          # sur `main`, elle liste les tests lents sans échouer.
          if [ "$EVENEMENT" = pull_request ]; then export BRIGADE_DUREE_MODE=pr BRIGADE_DUREE_BASE=HEAD^1; else export BRIGADE_DUREE_MODE=main; fi
          unset NODE_USE_ENV_PROXY ZONE PART OF EVENEMENT
          if [ -w /dev/shm ]; then export TMPDIR="$(mktemp -d /dev/shm/brigade-tests.XXXXXX)"; trap 'rm -rf "$TMPDIR"' EXIT; fi
          # Les tests en échec, par leur nom et leur erreur, deviennent une annotation du check : elle se
          # lit par l'API (`gh api repos/<dépôt>/check-runs/<job>/annotations`), sans le journal du job.
          journal="${RUNNER_TEMP:-/tmp}/tests.log"
          code=0
          (cd "${{ matrix.zone }}" && exec sh -c "${commande/"$motif"/$fichiers}") </dev/null 2>&1 | tee "$journal" || code=$?
          if [ "$code" -ne 0 ]; then
            if grep -q '^✖ failing tests:' "$journal"; then echecs="$(sed -n '/^✖ failing tests:/,$p' "$journal" | grep -v '^ *at ' | head -60)"
            else echecs="$(tail -40 "$journal")"; fi
            echo "::error title=tests ${{ matrix.zone }} (${{ matrix.part }}/${{ matrix.of }})::$(printf '%s\n' "$echecs" | awk '{ gsub(/%/, "%25"); gsub(/\r/, ""); printf "%s%%0A", $0 }')"
          fi
          exit "$code"
