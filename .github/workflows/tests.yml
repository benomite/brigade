# Les gates entières, sur GitHub Actions (#1004) : la station qui cuisine ne joue que les tests
# proches d'un changement (`tests-touches.mjs --proches`) ; ici, sur une PR, se jouent tous ceux
# qu'il touche, et sur `main` après un merge, la suite entière (le diff y est vide). La pass attend ces
# checks avant de merger. Le dépôt est public : les runners de GitHub n'y coûtent rien.
#
# Chaque check rend son verdict en moins de 60 s après le démarrage de son job (#2086) : la suite est
# coupée en parts qui courent en parallèle, une part rouge arrête les autres (`fail-fast`), les
# dépendances viennent du cache de npm, et `timeout-minutes: 3` plafonne un job qui pend. Les checks :
#   - `gates`                          : les gates du dépôt, sans leurs suites (jouées par les parts) ;
#   - `tests <zone> (<i>/<n>)`         : la part i de n des tests de la zone, ceux que la PR touche ;
#   - `types (<zone>)`                 : le contrôle de types de la zone.
# Le nombre de parts se règle dans la matrice de `tests` : plus de parts, des parts plus courtes.
name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Les gates sans leurs suites : sans `package.json`, une zone n'a « aucun test à jouer » (ce n'est
  # pas un échec) et ses types ne partent pas. Les suites se jouent dans `tests`, les types dans `types`.
  # Ce contournement est fragile : il suppose que `gates.sh` traite une zone sans `package.json` comme
  # absente. Si `gates.sh` change, la suppression ci-dessous est à revoir.
  # `gates` est le seul verdict : la pass le connaît comme vert sur `main` et n'excuse pas son rouge.
  # Il attend `tests` et `types` (`always()` : même quand l'un échoue ou est annulé par `fail-fast`)
  # et est rouge si l'un d'eux n'est pas `success`.
  gates:
    needs: [tests, types]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Tout l'historique : les gates lisent leur diff depuis `origin/<base>` (binding « Branche d'intégration » du CLAUDE.md).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Verdict de tests et de types
        run: |
          test "${{ needs.tests.result }}" = success || { echo "tests : ${{ needs.tests.result }}" >&2; exit 1; }
          test "${{ needs.types.result }}" = success || { echo "types : ${{ needs.types.result }}" >&2; exit 1; }
      - name: Gates (suites et types joués par les autres jobs)
        run: |
          rm runtime/package.json app/package.json
          .claude/brigade/gates.sh "$PWD"

  types:
    name: types (${{ matrix.zone }})
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      matrix:
        zone: [runtime, app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ${{ matrix.zone }}/package-lock.json
      # Comme le setup de worktree : celles de l'app sans leurs scripts (pas de binaire d'Electron).
      - name: Dépendances
        run: npm ci --ignore-scripts --prefix ${{ matrix.zone }}
      - name: Contrôle de types
        run: npm --prefix ${{ matrix.zone }} run typecheck

  tests:
    name: tests ${{ matrix.zone }} (${{ matrix.part }}/${{ matrix.of }})
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      # Une part rouge arrête les autres : le verdict ne se fait pas attendre.
      fail-fast: true
      matrix:
        include:
          - { zone: runtime, part: 1, of: 16 }
          - { zone: runtime, part: 2, of: 16 }
          - { zone: runtime, part: 3, of: 16 }
          - { zone: runtime, part: 4, of: 16 }
          - { zone: runtime, part: 5, of: 16 }
          - { zone: runtime, part: 6, of: 16 }
          - { zone: runtime, part: 7, of: 16 }
          - { zone: runtime, part: 8, of: 16 }
          - { zone: runtime, part: 9, of: 16 }
          - { zone: runtime, part: 10, of: 16 }
          - { zone: runtime, part: 11, of: 16 }
          - { zone: runtime, part: 12, of: 16 }
          - { zone: runtime, part: 13, of: 16 }
          - { zone: runtime, part: 14, of: 16 }
          - { zone: runtime, part: 15, of: 16 }
          - { zone: runtime, part: 16, of: 16 }
          - { zone: app, part: 1, of: 3 }
          - { zone: app, part: 2, of: 3 }
          - { zone: app, part: 3, of: 3 }
    steps:
      # Deux commits suffisent : sur une PR, le premier parent du commit de merge est la base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: ${{ matrix.zone }}/package-lock.json
      - name: Dépendances
        run: npm ci --ignore-scripts --prefix ${{ matrix.zone }}
      # Les fichiers de la part : ceux que la PR touche (`tests-touches.mjs`, comme les gates), ou tous
      # sur `main`, où le diff est vide. Le script `test` de la zone y remplace son motif par la part.
      - name: Tests
        env:
          ZONE: ${{ matrix.zone }}
          PART: ${{ matrix.part }}
          OF: ${{ matrix.of }}
          EVENEMENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          regle="tout"
          if [ "$EVENEMENT" = pull_request ]; then
            sel="$(git diff --name-only HEAD^1 HEAD | node .claude/brigade/tests-touches.mjs --souche HEAD^1)" \
              || { echo "tests-touches.mjs a échoué : sélection des tests impossible" >&2; exit 1; }
            regle="$(printf '%s\n' "$sel" | sed -n "s/^$ZONE //p")"
            [ -n "$regle" ] || { echo "tests-touches.mjs ne dit rien de la zone $ZONE : sortie '$sel'" >&2; exit 1; }
          fi
          case "$regle" in
            rien) echo "aucun test de $ZONE ne touche ce changement"; exit 0 ;;
            "fichiers "*) liste="$(printf '%s\n' ${regle#fichiers } | sort)" ;;
            *) liste="$(cd "$ZONE" && git ls-files ':(glob)test/**/*.test.ts' | sort)" ;;
          esac
          fichiers="$(printf '%s\n' "$liste" | awk -v i="$PART" -v n="$OF" 'NR % n == i % n' | tr '\n' ' ')"
          if [ -z "${fichiers// /}" ]; then echo "part $PART/$OF : aucun fichier"; exit 0; fi
          motif='"test/**/*.test.ts"'
          commande="$(node -e 'console.log(require(process.argv[1]).scripts.test)' "$PWD/$ZONE/package.json")"
          case "$commande" in *"$motif"*) ;; *) echo "le script test de $ZONE n'a plus son motif $motif" >&2; exit 1 ;; esac
          echo "part $PART/$OF : $(set -- $fichiers; echo $#) fichiers"
          # L'environnement que `gates.sh` donne à ses suites, celui où elles étaient vertes sur `main` :
          # pas d'entrée, pas de proxy de Node, ni les variables de ce job ; le répertoire temporaire en
          # mémoire, le cache de compilation à sa place.
          export NODE_COMPILE_CACHE="${NODE_COMPILE_CACHE:-${TMPDIR:-/tmp}/brigade-runtime-compile-cache}"
          # La garde des 2 s (#2322) : sur une PR, elle ne fait échouer que les tests que la PR ajoute ou change ;
          # sur `main`, elle liste les tests lents sans échouer.
          if [ "$EVENEMENT" = pull_request ]; then export BRIGADE_DUREE_MODE=pr BRIGADE_DUREE_BASE=HEAD^1; else export BRIGADE_DUREE_MODE=main; fi
          unset NODE_USE_ENV_PROXY ZONE PART OF EVENEMENT
          if [ -w /dev/shm ]; then export TMPDIR="$(mktemp -d /dev/shm/brigade-tests.XXXXXX)"; trap 'rm -rf "$TMPDIR"' EXIT; fi
          # Les tests en échec, par leur nom et leur erreur, deviennent une annotation du check : elle se
          # lit par l'API (`gh api repos/<dépôt>/check-runs/<job>/annotations`), sans le journal du job.
          journal="${RUNNER_TEMP:-/tmp}/tests.log"
          code=0
          (cd "${{ matrix.zone }}" && exec sh -c "${commande/"$motif"/$fichiers}") </dev/null 2>&1 | tee "$journal" || code=$?
          if [ "$code" -ne 0 ]; then
            if grep -q '^✖ failing tests:' "$journal"; then echecs="$(sed -n '/^✖ failing tests:/,$p' "$journal" | grep -v '^ *at ' | head -60)"
            else echecs="$(tail -40 "$journal")"; fi
            echo "::error title=tests ${{ matrix.zone }} (${{ matrix.part }}/${{ matrix.of }})::$(printf '%s\n' "$echecs" | awk '{ gsub(/%/, "%25"); gsub(/\r/, ""); printf "%s%%0A", $0 }')"
          fi
          exit "$code"
