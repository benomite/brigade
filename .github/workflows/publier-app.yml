# Publie l'app : à chaque merge sur la branche d'intégration qui change l'app, une release `app-v<version>` avec ce que
# les apps installées lisent et téléchargent (app/src/mise-a-jour/flux.ts) — pour le Mac
# `Brigade-<version>-arm64.dmg` et `latest-mac.yml`, pour Windows `Brigade-<version>-x64-setup.exe`
# et `latest.yml`, tous à la racine de la release. Personne ne pose de tag : ce workflow crée le
# tag et la release lui-même, dans le même run que les constructions (un tag créé avec
# GITHUB_TOKEN ne déclenche aucun autre workflow). C'est le seul chemin de publication de l'app :
# un tag `app-v*` poussé à la main ne publie rien, il devient seulement la base du merge suivant
# (une version mineure ou majeure se monte ainsi). Le détail : app/packaging/README.md.
#
# Le job `decider` joue scripts/app-release/decider.ts sur les fichiers changés depuis le dernier
# tag `app-v*` : un merge qui ne change pas l'app finit vert, sans rien construire ni publier. Lire
# depuis le dernier tag, et non depuis le seul push, fait qu'un run annulé ou échoué ne perd pas
# son changement : le suivant le publie. `workflow_dispatch` rejoue la décision à la main.
#
# Deux chemins, selon les secrets de signature (#1441, #1526), sur un seul jeu de jobs. Le job
# `detecter-secrets` regarde leur seule présence. Si aucun des six n'est posé, le chemin NON SIGNÉ
# construit et publie le .dmg, l'installeur .exe et l'.apk, sans `latest-mac.yml` ni `latest.yml` :
# une app installée ne se met donc pas à jour vers une app non signée. Sinon, le chemin SIGNÉ
# (#1441) joue : le .dmg est signé Developer ID, notarisé et agrafé, l'installeur Windows est signé,
# et la release porte aussi les deux fichiers de mise à jour. Les jobs `mac`, `windows` et `publier`
# sont les mêmes des deux côtés ; seules leurs étapes de signature, et l'`android` du seul chemin non
# signé, dépendent de ce choix. Les certificats et identifiants sont des secrets du dépôt, listés
# dans docs/app-signing-secrets.md.
# Le job `verifier-secrets` les vérifie avant toute construction : s'il en manque un (mais pas tous),
# rien n'est construit ni publié, la PR mergée reçoit un commentaire d'une phrase qui le nomme et dit
# où l'ajouter, et le run finit rouge. Un merge qui ne change pas l'app ne les lit pas.
name: publier-app

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deux publications ne se doublent pas : chacune lit les tags que la précédente a posés.
concurrency:
  group: publier-app
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  decider:
    # Seule la branche d'intégration se publie, même lancé à la main.
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.decision.outputs.changed }}
      tag: ${{ steps.decision.outputs.tag }}
      # Ce push-ci change-t-il l'app, ou ne fait-il que porter un changement d'avant, pas encore
      # publié ? Seul le premier vaut un commentaire de secret manquant à sa PR.
      ce_merge: ${{ steps.decision.outputs.ce_merge }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tout l'historique et tous les tags : le diff part du dernier tag `app-v*`.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Décider si ce merge publie l'app
        id: decision
        env:
          AVANT: ${{ github.event.before }}
          EVENEMENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          tags=$(git tag --list 'app-v*' --sort=-version:refname)
          derniere=$(echo "$tags" | head -n 1)
          if [ -n "$derniere" ]; then
            echo "Changes since the last app tag, $derniere."
            git diff --name-only "$derniere" HEAD > "$RUNNER_TEMP/changes"
          elif [ -n "$AVANT" ] && ! [[ "$AVANT" =~ ^0+$ ]] && git cat-file -e "$AVANT^{commit}" 2>/dev/null; then
            echo "No app tag yet: changes of this push, since $AVANT."
            git diff --name-only "$AVANT" HEAD > "$RUNNER_TEMP/changes"
          else
            echo "No app tag yet, and no previous commit to compare with: every file counts."
            git ls-files > "$RUNNER_TEMP/changes"
          fi
          arguments=()
          for tag in $tags; do arguments+=(--tag "$tag"); done
          node scripts/app-release/decider.ts "${arguments[@]}" < "$RUNNER_TEMP/changes" > "$RUNNER_TEMP/decision"
          tee -a "$GITHUB_OUTPUT" < "$RUNNER_TEMP/decision"
          if [ "$EVENEMENT" != push ]; then
            # Lancé à la main : aucun merge à qui le dire.
            ce_merge=false
          elif [ -n "$AVANT" ] && ! [[ "$AVANT" =~ ^0+$ ]] && git cat-file -e "$AVANT^{commit}" 2>/dev/null; then
            git diff --name-only "$AVANT" HEAD | node scripts/app-release/decider.ts | grep -qx 'changed=true' && ce_merge=true || ce_merge=false
          else
            # Sans commit d'avant à comparer, ce push compte comme changeant l'app.
            ce_merge=true
          fi
          echo "ce_merge=$ce_merge" | tee -a "$GITHUB_OUTPUT"
          if grep -qx 'changed=true' "$RUNNER_TEMP/decision"; then
            echo "The app changed: this run publishes $(sed -n 's/^tag=//p' "$RUNNER_TEMP/decision")." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The app did not change: nothing to publish." >> "$GITHUB_STEP_SUMMARY"
          fi

  detecter-secrets:
    # Les secrets de signature sont-ils tous absents ? Alors le chemin non signé publie ; sinon le
    # chemin signé joue (et `verifier-secrets` refuse un jeu incomplet).
    needs: decider
    if: needs.decider.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      non_signe: ${{ steps.presence.outputs.non_signe }}
    steps:
      - name: Chercher les secrets de signature
        id: presence
        env:
          # Leur seule présence : aucune valeur n'entre dans cette étape.
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
        run: |
          set -euo pipefail
          if [ "$MACOS_CERTIFICATE$MACOS_CERTIFICATE_PASSWORD$APPLE_ID$APPLE_APP_SPECIFIC_PASSWORD$WINDOWS_CERTIFICATE$WINDOWS_CERTIFICATE_PASSWORD" != falsefalsefalsefalsefalsefalse ]; then
            echo "non_signe=false" >> "$GITHUB_OUTPUT"
            echo "At least one signing secret is set: the signed path runs."
          else
            echo "non_signe=true" >> "$GITHUB_OUTPUT"
            echo "No signing secret is set: the builds are unsigned."
          fi

  verifier-secrets:
    # Avant toute construction : chaque secret de signature est là, ou rien ne part.
    needs: [decider, detecter-secrets]
    if: needs.decider.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Vérifier les secrets de signature
        env:
          # Leur seule présence : aucune valeur n'entre dans cette étape.
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
          NON_SIGNE: ${{ needs.detecter-secrets.outputs.non_signe }}
          TAG: ${{ needs.decider.outputs.tag }}
          CE_MERGE: ${{ needs.decider.outputs.ce_merge }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SERVEUR: ${{ github.server_url }}
        run: |
          set -euo pipefail
          if [ "$NON_SIGNE" = true ]; then
            echo "No signing secret is set: the unsigned path runs, nothing to check."
            exit 0
          fi
          # Chaque secret, et ce qu'il est, dit au chef en clair (docs/app-signing-secrets.md).
          declare -A ce_qu_il_est=(
            [MACOS_CERTIFICATE]="the Mac Developer ID certificate"
            [MACOS_CERTIFICATE_PASSWORD]="the password of the Mac certificate"
            [APPLE_ID]="the Apple Account that notarizes the Mac app"
            [APPLE_APP_SPECIFIC_PASSWORD]="the app-specific password of that Apple Account"
            [WINDOWS_CERTIFICATE]="the Windows code signing certificate"
            [WINDOWS_CERTIFICATE_PASSWORD]="the password of the Windows certificate"
          )
          ordre=(MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD)
          manquants=()
          for nom in "${ordre[@]}"; do
            [ "${!nom}" = true ] || manquants+=("$nom")
          done
          if [ "${#manquants[@]}" -eq 0 ]; then
            echo "Every signing secret is set: ${ordre[*]}."
            exit 0
          fi

          # Une seule phrase, qui nomme chaque secret manquant et dit où l'ajouter.
          doc="$SERVEUR/$GH_REPO/blob/${GITHUB_REF_NAME}/docs/app-signing-secrets.md"
          reglages="$SERVEUR/$GH_REPO/settings/secrets/actions"
          noms=""
          for i in "${!manquants[@]}"; do
            nom="${manquants[$i]}"
            morceau="[\`$nom\`]($doc#${nom,,}) (${ce_qu_il_est[$nom]})"
            if [ "$i" -eq 0 ]; then noms="$morceau"
            elif [ "$i" -eq $(( ${#manquants[@]} - 1 )) ]; then noms="$noms and $morceau"
            else noms="$noms, $morceau"
            fi
          done
          if [ "${#manquants[@]}" -eq 1 ]; then
            phrase="Brigade ${TAG#app-v} was not published because the repository secret $noms is missing: add it under the repository's [Settings > Secrets and variables > Actions]($reglages)."
          else
            phrase="Brigade ${TAG#app-v} was not published because the repository secrets $noms are missing: add them under the repository's [Settings > Secrets and variables > Actions]($reglages)."
          fi
          echo "$phrase" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Missing signing secrets, nothing is built or published: ${manquants[*]}."

          if [ "$CE_MERGE" != true ]; then
            # Ce merge ne change pas l'app : il ne fait que porter un changement d'avant, dont la PR
            # a déjà reçu ce commentaire (ou le run est lancé à la main). Rien n'est commenté.
            echo "This run's merge does not change the app: no comment is posted."
            exit 1
          fi
          pr=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null)][0].number // empty' || true)
          if [ -z "$pr" ]; then
            echo "::error::No merged pull request for $GITHUB_SHA: the missing secrets are reported here only."
            exit 1
          fi
          gh pr comment "$pr" --body "$phrase"
          echo "Reported on #$pr: $phrase"
          exit 1

  mac:
    needs: [decider, detecter-secrets, verifier-secrets]
    if: needs.decider.outputs.changed == 'true'
    runs-on: macos-14
    timeout-minutes: 90
    env:
      TAG: ${{ needs.decider.outputs.tag }}
      NON_SIGNE: ${{ needs.detecter-secrets.outputs.non_signe }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Installer les dépendances de l'app
        run: npm ci --ignore-scripts --prefix app
      # --- Signature (Mac) -------------------------------------------------------------------------
      # Le certificat Developer ID entre dans un trousseau propre au run, et les identifiants de
      # notarisation dans un profil `notarytool` de ce trousseau. construire.ts signe alors l'app
      # binaire par binaire, la notarise, l'agrafe, puis signe, notarise et agrafe le .dmg ; il écrit
      # `latest-mac.yml` pour le .dmg signé (app/packaging/README.md, « Signer, notariser »).
      - name: Signature (Mac) — poser le certificat et la notarisation
        id: signature
        if: needs.detecter-secrets.outputs.non_signe != 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          trousseau="$RUNNER_TEMP/signature.keychain-db"
          mot_de_passe=$(openssl rand -base64 24)
          echo "::add-mask::$mot_de_passe"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificat.p12"
          security create-keychain -p "$mot_de_passe" "$trousseau"
          security set-keychain-settings -lut 21600 "$trousseau"
          security unlock-keychain -p "$mot_de_passe" "$trousseau"
          # L'autorité intermédiaire d'Apple, sans laquelle l'identité Developer ID n'est pas valide.
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$trousseau"
          security import "$RUNNER_TEMP/certificat.p12" -k "$trousseau" -f pkcs12 -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security \
            || { rm -f "$RUNNER_TEMP/certificat.p12"; echo "::error::MACOS_CERTIFICATE could not be imported with MACOS_CERTIFICATE_PASSWORD (docs/app-signing-secrets.md)."; exit 1; }
          rm -f "$RUNNER_TEMP/certificat.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$mot_de_passe" "$trousseau" > /dev/null
          # Le trousseau du run passe devant : codesign y trouve l'identité, notarytool le profil.
          read -r -a trousseaux <<< "$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')"
          security list-keychains -d user -s "$trousseau" "${trousseaux[@]}"
          security default-keychain -d user -s "$trousseau"
          identite=$(security find-identity -v -p codesigning "$trousseau" | sed -n 's/^ *[0-9]*) [0-9A-F]* "\(Developer ID Application: .*\)"$/\1/p' | head -n 1)
          [ -n "$identite" ] || { echo "::error::MACOS_CERTIFICATE holds no valid Developer ID Application identity (docs/app-signing-secrets.md)."; exit 1; }
          # L'équipe est entre les parenthèses de l'identité : « Developer ID Application: Nom (ABCDE12345) ».
          equipe=$(echo "$identite" | sed -n 's/.*(\([A-Z0-9]*\))$/\1/p')
          xcrun notarytool store-credentials brigade-notarisation --apple-id "$APPLE_ID" --team-id "$equipe" --password "$APPLE_APP_SPECIFIC_PASSWORD" --keychain "$trousseau" \
            || { echo "::error::Apple refused APPLE_ID and APPLE_APP_SPECIFIC_PASSWORD for the team $equipe (docs/app-signing-secrets.md)."; exit 1; }
          echo "Signing as $identite, notarizing for the team $equipe."
          {
            echo "identite=$identite"
            echo "trousseau=$trousseau"
          } >> "$GITHUB_OUTPUT"
      - name: Construire le .dmg, non signé
        if: needs.detecter-secrets.outputs.non_signe == 'true'
        run: |
          set -euo pipefail
          echo "::warning::The builds are unsigned: no signing secret is set."
          npm --prefix app run dist -- --version "${TAG#app-v}" --sortie "$RUNNER_TEMP/dist"
      - name: Construire, signer et notariser le .dmg
        if: needs.detecter-secrets.outputs.non_signe != 'true'
        env:
          IDENTITE: ${{ steps.signature.outputs.identite }}
        run: |
          set -euo pipefail
          npm --prefix app run dist -- --version "${TAG#app-v}" --sortie "$RUNNER_TEMP/dist" --identite "$IDENTITE" --notariser brigade-notarisation
      - name: Signature (Mac) — vérifier ce que Gatekeeper dira
        if: needs.detecter-secrets.outputs.non_signe != 'true'
        run: |
          set -euo pipefail
          dmg="$RUNNER_TEMP/dist/Brigade-${TAG#app-v}-arm64.dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          point=$(mktemp -d "$RUNNER_TEMP/dmg.XXXXXX")
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$point" "$dmg" > /dev/null
          trap 'hdiutil detach "$point" -force > /dev/null || true' EXIT
          # Ce que vérifie l'app installée avant de se remplacer (app/src/mise-a-jour/installation.ts).
          codesign --verify --deep --strict --verbose=2 "$point/Brigade.app"
          xcrun stapler validate "$point/Brigade.app"
          spctl --assess --type execute --verbose=2 "$point/Brigade.app"
      - name: Signature (Mac) — retirer le trousseau
        if: always() && steps.signature.outputs.trousseau != ''
        env:
          TROUSSEAU: ${{ steps.signature.outputs.trousseau }}
        run: |
          security delete-keychain "$TROUSSEAU" || true
      - name: Vérifier ce qui part vers la release
        run: |
          set -euo pipefail
          dmg="Brigade-${TAG#app-v}-arm64.dmg"
          test -f "$RUNNER_TEMP/dist/$dmg"
          if [ "$NON_SIGNE" = true ]; then
            # Une app non signée ne se met pas à jour : la construction écrit `latest-mac.yml`, il ne part pas.
            rm -f "$RUNNER_TEMP/dist/latest-mac.yml"
          else
            grep -qx "path: $dmg" "$RUNNER_TEMP/dist/latest-mac.yml" || { echo "::error::latest-mac.yml does not name $dmg"; cat "$RUNNER_TEMP/dist/latest-mac.yml"; exit 1; }
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-mac
          path: |
            ${{ runner.temp }}/dist/Brigade-*-arm64.dmg
            ${{ runner.temp }}/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: [decider, detecter-secrets, verifier-secrets]
    if: needs.decider.outputs.changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TAG: ${{ needs.decider.outputs.tag }}
      NON_SIGNE: ${{ needs.detecter-secrets.outputs.non_signe }}
    steps:
      - name: Garder les fins de ligne du dépôt
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Construire l'installeur
        shell: bash
        run: |
          set -euo pipefail
          node app/packaging/windows.ts --version "${TAG#app-v}" --sortie "$RUNNER_TEMP/dist"
      # --- Signature (Windows) ---------------------------------------------------------------------
      # L'installeur est signé (SHA-256, horodaté), avant qu'il ne parte vers la release. Signer
      # change ses octets : `latest.yml`, écrit par la construction, est réécrit pour l'installeur
      # signé (`metadonneesDeMiseAJour` de app/packaging/construire.ts).
      - name: Signature (Windows) — signer l'installeur
        if: needs.detecter-secrets.outputs.non_signe != 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:TAG -replace '^app-v', ''
          $installeur = Join-Path $env:RUNNER_TEMP "dist\Brigade-$version-x64-setup.exe"
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like '*\x64\*' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found in the Windows SDK of the runner' }
          $pfx = Join-Path $env:RUNNER_TEMP 'certificat.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 /d Brigade $installeur
            $signe = $LASTEXITCODE -eq 0
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
          if (-not $signe) {
            Write-Output '::error::The installer could not be signed with WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD (docs/app-signing-secrets.md).'
            exit 1
          }
          # Ce que montrent les propriétés du fichier : une signature valide.
          & $signtool.FullName verify /pa /v $installeur
          if ($LASTEXITCODE -ne 0) { Write-Output '::error::The signed installer does not verify.'; exit 1 }
          $signature = Get-AuthenticodeSignature $installeur
          if ($signature.Status -ne 'Valid') { Write-Output "::error::The installer signature is $($signature.Status): $($signature.StatusMessage)"; exit 1 }
          Write-Output "Signed by $($signature.SignerCertificate.Subject)."
      - name: Signature (Windows) — réécrire latest.yml pour l'installeur signé
        if: needs.detecter-secrets.outputs.non_signe != 'true'
        shell: bash
        run: |
          set -euo pipefail
          INSTALLEUR="$RUNNER_TEMP/dist/Brigade-${TAG#app-v}-x64-setup.exe" node --input-type=module -e '
          const { writeFileSync } = await import("node:fs");
          const { dirname, join } = await import("node:path");
          const { pathToFileURL } = await import("node:url");
          const { metadonneesDeMiseAJour } = await import(pathToFileURL(join(process.cwd(), "app/packaging/construire.ts")).href);
          const installeur = process.env.INSTALLEUR;
          writeFileSync(join(dirname(installeur), "latest.yml"), metadonneesDeMiseAJour(process.env.TAG.replace(/^app-v/, ""), installeur, new Date().toISOString()));
          '
          cat "$RUNNER_TEMP/dist/latest.yml"
      - name: Vérifier ce qui part vers la release
        shell: bash
        run: |
          set -euo pipefail
          installeur="Brigade-${TAG#app-v}-x64-setup.exe"
          test -f "$RUNNER_TEMP/dist/$installeur"
          if [ "$NON_SIGNE" = true ]; then
            # Une app non signée ne se met pas à jour : la construction écrit `latest.yml`, il ne part pas.
            echo "::warning::The builds are unsigned: no signing secret is set."
            rm -f "$RUNNER_TEMP/dist/latest.yml"
          else
            tr -d '\r' < "$RUNNER_TEMP/dist/latest.yml" | grep -qx "path: $installeur" || { echo "::error::latest.yml does not name $installeur"; cat "$RUNNER_TEMP/dist/latest.yml"; exit 1; }
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: |
            ${{ runner.temp }}/dist/Brigade-*-x64-setup.exe
            ${{ runner.temp }}/dist/latest.yml
          if-no-files-found: error
          retention-days: 7

  android:
    needs: [decider, detecter-secrets, verifier-secrets]
    # Le seul .apk est non signé (clé de debug) : le chemin signé n'en construit pas.
    if: needs.decider.outputs.changed == 'true' && needs.detecter-secrets.outputs.non_signe == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TAG: ${{ needs.decider.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Construire l'APK, non signé (clé de debug)
        # Le SDK Android est préinstallé sur le runner (ANDROID_HOME) ; setup-java pose JAVA_HOME.
        run: |
          set -euo pipefail
          node app/packaging/android.ts --version "${TAG#app-v}" --sortie "$RUNNER_TEMP/dist"
          test -f "$RUNNER_TEMP/dist/Brigade-${TAG#app-v}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: app-android
          path: ${{ runner.temp }}/dist/Brigade-*.apk
          if-no-files-found: error
          retention-days: 7

  publier:
    needs: [decider, detecter-secrets, verifier-secrets, mac, windows, android]
    # `android` est sauté sur le chemin signé : `always()` laisse `publier` jouer, et chaque
    # construction attendue doit alors avoir réussi.
    if: >-
      always() && needs.decider.outputs.changed == 'true'
      && needs.verifier-secrets.result == 'success'
      && needs.mac.result == 'success' && needs.windows.result == 'success'
      && (needs.android.result == 'success' || (needs.android.result == 'skipped' && needs.detecter-secrets.outputs.non_signe != 'true'))
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.decider.outputs.tag }}
      NON_SIGNE: ${{ needs.detecter-secrets.outputs.non_signe }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#app-v}"
          cd "$RUNNER_TEMP/release"
          for construit in "Brigade-$version-arm64.dmg" "Brigade-$version-x64-setup.exe"; do
            test -f "$construit" || { echo "::error::$construit was not built — nothing is published"; ls -la; exit 1; }
          done
          if [ "$NON_SIGNE" = true ]; then
            test -f "Brigade-$version.apk" || { echo "::error::Brigade-$version.apk was not built — nothing is published"; ls -la; exit 1; }
            signe=()
          else
            signe=(--signe)
          fi
          # Les noms de la release disent la plateforme ; les fichiers de mise à jour suivent.
          node "$GITHUB_WORKSPACE/scripts/app-release/paquets.ts" renommer --version "$version" --dossier .
          node "$GITHUB_WORKSPACE/scripts/app-release/paquets.ts" notes --produit app --version "$version" --commit "$GITHUB_SHA" "${signe[@]}" > "$RUNNER_TEMP/notes.md"
          if [ "$NON_SIGNE" = true ]; then
            fichiers=("Brigade-$version-mac-arm64.dmg" "Brigade-$version-windows-x64-setup.exe" "Brigade-$version-android.apk")
            resume="The builds are unsigned. Published $TAG: ${fichiers[*]}."
          else
            fichiers=("Brigade-$version-mac-arm64.dmg" latest-mac.yml "Brigade-$version-windows-x64-setup.exe" latest.yml)
            resume="Published $TAG: ${fichiers[*]}."
          fi
          for fichier in "${fichiers[@]}"; do
            test -f "$fichier" || { echo "::error::$fichier was not built — nothing is published"; ls -la; exit 1; }
          done
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Un run rejoué : la release existe, ses fichiers et ses notes sont remplacés.
            gh release upload "$TAG" "${fichiers[@]}" --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            # `--latest=false` : la dernière release du dépôt reste celle de la station, que
            # `releases/latest/download/installer-station.sh` trouve. L'app lit ses versions par
            # leurs tags `app-v*`.
            gh release create "$TAG" "${fichiers[@]}" \
              --target "$GITHUB_SHA" \
              --title "Brigade $version" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --latest=false
          fi
          echo "$resume" >> "$GITHUB_STEP_SUMMARY"
